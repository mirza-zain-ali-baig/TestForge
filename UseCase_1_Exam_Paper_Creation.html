<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow: hidden;
      width: 1100px;
      height: 680px;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px 28px 26px 28px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.05);
      width: 1060px;
      height: 640px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      border-bottom: 1.5px solid #f1f5f9;
      padding-bottom: 12px;
    }
    .title-group h1 {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .subtitle {
      font-size: 12.5px;
      color: #64748b;
      margin-top: 3px;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11.5px;
      color: #334155;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .leg-line {
      width: 22px;
      height: 2px;
    }
    .leg-assoc { background: #334155; }
    .leg-dep { border-top: 2px dashed #d97706; }
    .leg-ext { border-top: 2px dashed #2563eb; }
    .svg-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }
    /* SVG Styles */
    .assoc-line { stroke: #334155; stroke-width: 2; }
    .dep-line { stroke: #d97706; stroke-width: 2; stroke-dasharray: 6,4; }
    .ext-line { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,4; }
    .uc-ellipse {
      fill: #f0fdf4;
      stroke: #059669;
      stroke-width: 2;
    }
    .uc-ellipse-accent {
      fill: #ecfdf5;
      stroke: #047857;
      stroke-width: 2.8;
    }
    .uc-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #064e3b;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .uc-text-bold {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      fill: #047857;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .pill-label-dep {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      fill: #b45309;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .pill-label-ext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      fill: #1d4ed8;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-group">
        <h1>
          <span class="badge">Functionality 1</span>
          Exam Paper Creation &amp; Blueprint Engine
        </h1>
        <p class="subtitle">Syllabus filtering, blueprint matrix configuration, and automated AI shortfall synthesis fallback.</p>
      </div>
      <div class="legend">
        <span style="font-weight:700;">UML Legend:</span>
        <div class="legend-item"><div class="leg-line leg-assoc"></div><span>Association</span></div>
        <div class="legend-item"><div class="leg-line leg-dep"></div><span style="color:#d97706; font-weight:600;">&lt;&lt;depends on&gt;&gt;</span></div>
        <div class="legend-item"><div class="leg-line leg-ext"></div><span style="color:#2563eb; font-weight:600;">&lt;&lt;extend&gt;&gt;</span></div>
      </div>
    </div>
    <div class="svg-container">
      
    <svg viewBox="0 0 980 500" width="980" height="500">
      <defs>
        <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
        </marker>
        <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
      </defs>

      <!-- System Boundary -->
      <rect x="180" y="15" width="570" height="470" rx="16" fill="#fcfdfd" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
      <rect x="300" y="22" width="330" height="26" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="465" y="38" text-anchor="middle" font-weight="700" font-size="13" fill="#047857">ExamForge — Exam Creation Subsystem</text>

      <!-- Primary Actor: Teacher -->
      
    <g class="actor-figure" transform="translate(45, 150)">
      <circle cx="45" cy="28" r="18" stroke="#0f172a" stroke-width="3.2" fill="#ffffff" />
      <line x1="45" y1="46" x2="45" y2="100" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="78" y2="64" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="16" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="74" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <text x="45" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Teacher</text>
      <text x="45" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">(Primary Actor)</text>
    </g>
    

      <!-- Secondary Actor: Gemini AI -->
      
    <g class="actor-figure" transform="translate(840, 200)">
      <circle cx="45" cy="28" r="18" stroke="#0f172a" stroke-width="3.2" fill="#ffffff" />
      <line x1="45" y1="46" x2="45" y2="100" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="78" y2="64" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="16" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="74" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <text x="45" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Gemini AI</text>
      <text x="45" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">(External Engine)</text>
    </g>
    

      <!-- Use Cases -->
      <!-- UC1: Select Class & Subject -->
      <g transform="translate(220, 65)">
        <ellipse cx="100" cy="25" rx="100" ry="24" class="uc-ellipse"/>
        <text x="100" y="25" class="uc-text">Select Class &amp; Subject</text>
      </g>

      <!-- UC2: Filter Syllabus & Topics -->
      <g transform="translate(220, 140)">
        <ellipse cx="100" cy="25" rx="100" ry="24" class="uc-ellipse"/>
        <text x="100" y="25" class="uc-text">Filter Syllabus &amp; Topics</text>
      </g>

      <!-- UC3: Configure Blueprint Matrix -->
      <g transform="translate(220, 215)">
        <ellipse cx="100" cy="25" rx="100" ry="24" class="uc-ellipse"/>
        <text x="100" y="25" class="uc-text">Configure Blueprint Matrix</text>
      </g>

      <!-- UC4: Apply AI Blueprint (Extends UC3) -->
      <g transform="translate(480, 215)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#0284c7; fill:#f0f9ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#0369a1;">Apply AI Blueprint Suggestion</text>
      </g>

      <!-- UC5: Generate Test Paper (Core) -->
      <g transform="translate(210, 310)">
        <ellipse cx="110" cy="28" rx="110" ry="28" class="uc-ellipse-accent"/>
        <text x="110" y="28" class="uc-text-bold">Generate Test Paper</text>
      </g>

      <!-- UC6: AI Question Shortfall Fill (Extends UC5) -->
      <g transform="translate(480, 315)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#0284c7; fill:#f0f9ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#0369a1;">AI Question Shortfall Fill</text>
      </g>

      <!-- UC7: Save Paper to My Tests -->
      <g transform="translate(220, 405)">
        <ellipse cx="100" cy="25" rx="100" ry="24" class="uc-ellipse"/>
        <text x="100" y="25" class="uc-text">Save Paper to My Tests</text>
      </g>

      <!-- Association Lines from Teacher -->
      <line x1="125" y1="205" x2="225" y2="90" class="assoc-line" />
      <line x1="125" y1="210" x2="220" y2="165" class="assoc-line" />
      <line x1="125" y1="215" x2="220" y2="240" class="assoc-line" />
      <line x1="125" y1="220" x2="210" y2="338" class="assoc-line" />
      <line x1="125" y1="225" x2="225" y2="430" class="assoc-line" />

      <!-- Associations to Gemini AI -->
      <line x1="690" y1="240" x2="835" y2="255" class="assoc-line" />
      <line x1="690" y1="340" x2="835" y2="265" class="assoc-line" />

      <!-- Extends: UC4 extends UC3 -->
      <line x1="480" y1="240" x2="425" y2="240" class="ext-line" marker-end="url(#arr-blue)" />
      <rect x="424" y="230" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="452" y="240" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Extends: UC6 extends UC5 -->
      <line x1="480" y1="338" x2="435" y2="338" class="ext-line" marker-end="url(#arr-blue)" />
      <rect x="429" y="328" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="457" y="338" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Depends: UC5 depends on UC3 -->
      <line x1="320" y1="265" x2="320" y2="310" class="dep-line" marker-end="url(#arr-amber)" />
      <rect x="282" y="278" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="320" y="288" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Depends: UC3 depends on UC2 -->
      <line x1="320" y1="165" x2="320" y2="215" class="dep-line" marker-end="url(#arr-amber)" />
      <rect x="282" y="180" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="320" y="190" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Depends: UC2 depends on UC1 -->
      <line x1="320" y1="90" x2="320" y2="140" class="dep-line" marker-end="url(#arr-amber)" />
      <rect x="282" y="105" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="320" y="115" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Depends: UC7 depends on UC5 -->
      <line x1="320" y1="368" x2="320" y2="405" class="dep-line" marker-end="url(#arr-amber)" />
      <rect x="282" y="377" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="320" y="387" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>
    </svg>
    
    </div>
  </div>
</body>
</html>
