<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow: hidden;
      width: 1100px;
      height: 680px;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px 28px 26px 28px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.05);
      width: 1060px;
      height: 640px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      border-bottom: 1.5px solid #f1f5f9;
      padding-bottom: 12px;
    }
    .title-group h1 {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .subtitle {
      font-size: 12.5px;
      color: #64748b;
      margin-top: 3px;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11.5px;
      color: #334155;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .leg-line {
      width: 22px;
      height: 2px;
    }
    .leg-assoc { background: #334155; }
    .leg-dep { border-top: 2px dashed #d97706; }
    .leg-ext { border-top: 2px dashed #2563eb; }
    .svg-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }
    /* SVG Styles */
    .assoc-line { stroke: #334155; stroke-width: 2; }
    .dep-line { stroke: #d97706; stroke-width: 2; stroke-dasharray: 6,4; }
    .ext-line { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,4; }
    .uc-ellipse {
      fill: #f0fdf4;
      stroke: #059669;
      stroke-width: 2;
    }
    .uc-ellipse-accent {
      fill: #ecfdf5;
      stroke: #047857;
      stroke-width: 2.8;
    }
    .uc-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #064e3b;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .uc-text-bold {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      fill: #047857;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .pill-label-dep {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      fill: #b45309;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .pill-label-ext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      fill: #1d4ed8;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-group">
        <h1>
          <span class="badge">Functionality 3</span>
          Interactive Paper Studio, Word/PDF Export &amp; Practice Mode
        </h1>
        <p class="subtitle">Inline rich editing, AI re-prompting, institution branding, Word OpenXML compilation, and timed practice.</p>
      </div>
      <div class="legend">
        <span style="font-weight:700;">UML Legend:</span>
        <div class="legend-item"><div class="leg-line leg-assoc"></div><span>Association</span></div>
        <div class="legend-item"><div class="leg-line leg-dep"></div><span style="color:#d97706; font-weight:600;">&lt;&lt;depends on&gt;&gt;</span></div>
        <div class="legend-item"><div class="leg-line leg-ext"></div><span style="color:#2563eb; font-weight:600;">&lt;&lt;extend&gt;&gt;</span></div>
      </div>
    </div>
    <div class="svg-container">
      
    <svg viewBox="0 0 980 500" width="980" height="500">
      <defs>
        <marker id="arr-amber-3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
        </marker>
        <marker id="arr-blue-3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
      </defs>

      <!-- System Boundary -->
      <rect x="180" y="15" width="580" height="470" rx="16" fill="#fcfdfd" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
      <rect x="290" y="22" width="360" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="470" y="38" text-anchor="middle" font-weight="700" font-size="13" fill="#1e293b">ExamForge — Paper Studio &amp; Export Subsystem</text>

      <!-- Primary Actor: Educator/Student -->
      
    <g class="actor-figure" transform="translate(45, 150)">
      <circle cx="45" cy="28" r="18" stroke="#0f172a" stroke-width="3.2" fill="#ffffff" />
      <line x1="45" y1="46" x2="45" y2="100" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="78" y2="64" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="16" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="74" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <text x="45" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">User</text>
      <text x="45" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">(Educator/Student)</text>
    </g>
    

      <!-- Secondary Actor: Gemini Assistant -->
      
    <g class="actor-figure" transform="translate(840, 200)">
      <circle cx="45" cy="28" r="18" stroke="#0f172a" stroke-width="3.2" fill="#ffffff" />
      <line x1="45" y1="46" x2="45" y2="100" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="78" y2="64" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="16" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="74" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <text x="45" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Gemini Studio</text>
      <text x="45" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">(AI Assistant)</text>
    </g>
    

      <!-- Use Cases -->
      <!-- UC1: Preview Formatted Paper -->
      <g transform="translate(215, 80)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#475569; fill:#f8fafc;"/>
        <text x="105" y="25" class="uc-text" style="fill:#1e293b;">Preview Formatted Exam Paper</text>
      </g>

      <!-- UC2: Drag & Drop Reorder (extends UC1) -->
      <g transform="translate(505, 55)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#0284c7; fill:#f0f9ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#0369a1;">Drag &amp; Drop Reorder Questions</text>
      </g>

      <!-- UC10: Launch Practice Online Mode (extends UC1) -->
      <g transform="translate(505, 115)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#7c3aed; fill:#f5f3ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#6d28d9;">Launch Practice Online Mode</text>
      </g>

      <!-- UC3: Inline Edit Questions -->
      <g transform="translate(215, 190)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#475569; fill:#f8fafc;"/>
        <text x="105" y="25" class="uc-text" style="fill:#1e293b;">Inline Edit Questions &amp; Marks</text>
      </g>

      <!-- UC4: Regenerate Question with AI (extends UC3) -->
      <g transform="translate(505, 175)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#0284c7; fill:#f0f9ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#0369a1;">Regenerate Question with AI</text>
      </g>

      <!-- UC5: Explain Question with AI (extends UC3) -->
      <g transform="translate(505, 235)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#0284c7; fill:#f0f9ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#0369a1;">Explain Question with AI</text>
      </g>

      <!-- UC6: Set Academy Name & Logo -->
      <g transform="translate(215, 280)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#475569; fill:#f8fafc;"/>
        <text x="105" y="25" class="uc-text" style="fill:#1e293b;">Set Academy Name &amp; Logo</text>
      </g>

      <!-- UC7: Export to Word (.docx) -->
      <g transform="translate(215, 350)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse-accent" style="stroke:#2563eb; fill:#eff6ff;"/>
        <text x="105" y="25" class="uc-text-bold" style="fill:#1d4ed8;">Export to Word (.docx)</text>
      </g>

      <!-- UC8: Export to PDF / Print Paper -->
      <g transform="translate(215, 415)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse-accent" style="stroke:#dc2626; fill:#fef2f2;"/>
        <text x="105" y="25" class="uc-text-bold" style="fill:#b91c1c;">Export to PDF / Print Paper</text>
      </g>

      <!-- UC9: Generate Detached Answer Key (extends UC7/UC8) -->
      <g transform="translate(505, 380)">
        <ellipse cx="108" cy="25" rx="108" ry="24" class="uc-ellipse" style="stroke:#059669; fill:#f0fdf4;"/>
        <text x="108" y="25" class="uc-text" style="fill:#064e3b;">Generate Detached Answer Key</text>
      </g>

      <!-- Associations from User -->
      <line x1="125" y1="205" x2="215" y2="105" class="assoc-line" />
      <line x1="125" y1="210" x2="215" y2="215" class="assoc-line" />
      <line x1="125" y1="215" x2="215" y2="305" class="assoc-line" />
      <line x1="125" y1="220" x2="215" y2="375" class="assoc-line" />
      <line x1="125" y1="225" x2="215" y2="440" class="assoc-line" />

      <!-- Associations to Gemini Assistant -->
      <line x1="715" y1="200" x2="835" y2="255" class="assoc-line" />
      <line x1="715" y1="260" x2="835" y2="265" class="assoc-line" />

      <!-- Extends: UC2 extends UC1 -->
      <line x1="505" y1="80" x2="425" y2="95" class="ext-line" marker-end="url(#arr-blue-3)" />
      <rect x="440" y="78" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="468" y="88" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Extends: UC10 extends UC1 -->
      <line x1="505" y1="130" x2="425" y2="115" class="ext-line" marker-end="url(#arr-blue-3)" />
      <rect x="440" y="115" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="468" y="125" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Extends: UC4 extends UC3 -->
      <line x1="505" y1="200" x2="425" y2="210" class="ext-line" marker-end="url(#arr-blue-3)" />
      <rect x="440" y="195" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="468" y="205" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Extends: UC5 extends UC3 -->
      <line x1="505" y1="250" x2="425" y2="225" class="ext-line" marker-end="url(#arr-blue-3)" />
      <rect x="440" y="230" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="468" y="240" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Depends: UC7 depends on UC6 -->
      <line x1="320" y1="330" x2="320" y2="350" class="dep-line" marker-end="url(#arr-amber-3)" />
      <rect x="282" y="332" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="320" y="342" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Depends: UC8 depends on UC6 -->
      <line x1="280" y1="330" x2="280" y2="415" class="dep-line" marker-end="url(#arr-amber-3)" />
      <rect x="242" y="365" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="280" y="375" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Extends: UC9 extends UC7 & UC8 -->
      <line x1="505" y1="395" x2="425" y2="380" class="ext-line" marker-end="url(#arr-blue-3)" />
      <rect x="440" y="380" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="468" y="390" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>
    </svg>
    
    </div>
  </div>
</body>
</html>
