<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow: hidden;
      width: 1100px;
      height: 680px;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px 28px 26px 28px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.05);
      width: 1060px;
      height: 640px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      border-bottom: 1.5px solid #f1f5f9;
      padding-bottom: 12px;
    }
    .title-group h1 {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .subtitle {
      font-size: 12.5px;
      color: #64748b;
      margin-top: 3px;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11.5px;
      color: #334155;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .leg-line {
      width: 22px;
      height: 2px;
    }
    .leg-assoc { background: #334155; }
    .leg-dep { border-top: 2px dashed #d97706; }
    .leg-ext { border-top: 2px dashed #2563eb; }
    .svg-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }
    /* SVG Styles */
    .assoc-line { stroke: #334155; stroke-width: 2; }
    .dep-line { stroke: #d97706; stroke-width: 2; stroke-dasharray: 6,4; }
    .ext-line { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,4; }
    .uc-ellipse {
      fill: #f0fdf4;
      stroke: #059669;
      stroke-width: 2;
    }
    .uc-ellipse-accent {
      fill: #ecfdf5;
      stroke: #047857;
      stroke-width: 2.8;
    }
    .uc-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #064e3b;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .uc-text-bold {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      fill: #047857;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .pill-label-dep {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      fill: #b45309;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .pill-label-ext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      fill: #1d4ed8;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-group">
        <h1>
          <span class="badge">Functionality 4</span>
          User Authentication &amp; Universal Access Management
        </h1>
        <p class="subtitle">Credentials &amp; OAuth sign-in, universal educator authoring privileges, and generation history.</p>
      </div>
      <div class="legend">
        <span style="font-weight:700;">UML Legend:</span>
        <div class="legend-item"><div class="leg-line leg-assoc"></div><span>Association</span></div>
        <div class="legend-item"><div class="leg-line leg-dep"></div><span style="color:#d97706; font-weight:600;">&lt;&lt;depends on&gt;&gt;</span></div>
        <div class="legend-item"><div class="leg-line leg-ext"></div><span style="color:#2563eb; font-weight:600;">&lt;&lt;extend&gt;&gt;</span></div>
      </div>
    </div>
    <div class="svg-container">
      
    <svg viewBox="0 0 980 500" width="980" height="500">
      <defs>
        <marker id="arr-amber-4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
        </marker>
        <marker id="arr-blue-4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
      </defs>

      <!-- System Boundary -->
      <rect x="180" y="15" width="580" height="470" rx="16" fill="#fcfdfd" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4"/>
      <rect x="290" y="22" width="360" height="26" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="470" y="38" text-anchor="middle" font-weight="700" font-size="13" fill="#4338ca">ExamForge — Authentication &amp; Access Subsystem</text>

      <!-- Primary Actor: User -->
      
    <g class="actor-figure" transform="translate(45, 150)">
      <circle cx="45" cy="28" r="18" stroke="#0f172a" stroke-width="3.2" fill="#ffffff" />
      <line x1="45" y1="46" x2="45" y2="100" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="78" y2="64" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="16" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="74" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <text x="45" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">User</text>
      <text x="45" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">(Instructor/Student)</text>
    </g>
    

      <!-- Secondary Actor: Google OAuth -->
      
    <g class="actor-figure" transform="translate(840, 160)">
      <circle cx="45" cy="28" r="18" stroke="#0f172a" stroke-width="3.2" fill="#ffffff" />
      <line x1="45" y1="46" x2="45" y2="100" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="78" y2="64" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="16" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="74" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <text x="45" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Google OAuth</text>
      <text x="45" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">(Identity Provider)</text>
    </g>
    

      <!-- Use Cases -->
      <!-- UC1: Register New Account -->
      <g transform="translate(220, 65)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#6366f1; fill:#eef2ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#312e81;">Register New Account</text>
      </g>

      <!-- UC2: Sign In with Email & Password -->
      <g transform="translate(220, 150)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#6366f1; fill:#eef2ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#312e81;">Sign In with Email &amp; Password</text>
      </g>

      <!-- UC3: Sign In with Google OAuth -->
      <g transform="translate(500, 150)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#0284c7; fill:#f0f9ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#0369a1;">Sign In with Google OAuth</text>
      </g>

      <!-- UC4: Universal Authoring Access -->
      <g transform="translate(210, 240)">
        <ellipse cx="115" cy="28" rx="115" ry="28" class="uc-ellipse-accent" style="stroke:#4338ca; fill:#eef2ff;"/>
        <text x="115" y="28" class="uc-text-bold" style="fill:#312e81;">Universal Authoring Access</text>
      </g>

      <!-- UC5: View Generation History -->
      <g transform="translate(220, 330)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#6366f1; fill:#eef2ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#312e81;">View Generation History &amp; Tests</text>
      </g>

      <!-- UC6: Sign Out of System -->
      <g transform="translate(220, 410)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#6366f1; fill:#eef2ff;"/>
        <text x="105" y="25" class="uc-text" style="fill:#312e81;">Sign Out of System</text>
      </g>

      <!-- Associations from User -->
      <line x1="125" y1="205" x2="220" y2="90" class="assoc-line" />
      <line x1="125" y1="210" x2="220" y2="175" class="assoc-line" />
      <line x1="125" y1="215" x2="210" y2="268" class="assoc-line" />
      <line x1="125" y1="220" x2="220" y2="355" class="assoc-line" />
      <line x1="125" y1="225" x2="220" y2="435" class="assoc-line" />

      <!-- Associations to Google OAuth -->
      <line x1="710" y1="175" x2="835" y2="215" class="assoc-line" />

      <!-- Extends: UC3 extends UC2 -->
      <line x1="500" y1="175" x2="435" y2="175" class="ext-line" marker-end="url(#arr-blue-4)" />
      <rect x="442" y="165" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="470" y="175" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Depends: UC4 depends on UC2 -->
      <line x1="325" y1="200" x2="325" y2="240" class="dep-line" marker-end="url(#arr-amber-4)" />
      <rect x="287" y="210" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="325" y="220" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Depends: UC5 depends on UC4 -->
      <line x1="325" y1="298" x2="325" y2="330" class="dep-line" marker-end="url(#arr-amber-4)" />
      <rect x="287" y="305" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="325" y="315" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Depends: UC6 depends on UC4 -->
      <line x1="325" y1="380" x2="325" y2="410" class="dep-line" marker-end="url(#arr-amber-4)" />
      <rect x="287" y="388" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="325" y="398" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>
    </svg>
    
    </div>
  </div>
</body>
</html>
