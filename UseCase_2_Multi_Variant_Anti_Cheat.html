<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow: hidden;
      width: 1100px;
      height: 680px;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px 28px 26px 28px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.05);
      width: 1060px;
      height: 640px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      border-bottom: 1.5px solid #f1f5f9;
      padding-bottom: 12px;
    }
    .title-group h1 {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .subtitle {
      font-size: 12.5px;
      color: #64748b;
      margin-top: 3px;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11.5px;
      color: #334155;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .leg-line {
      width: 22px;
      height: 2px;
    }
    .leg-assoc { background: #334155; }
    .leg-dep { border-top: 2px dashed #d97706; }
    .leg-ext { border-top: 2px dashed #2563eb; }
    .svg-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }
    /* SVG Styles */
    .assoc-line { stroke: #334155; stroke-width: 2; }
    .dep-line { stroke: #d97706; stroke-width: 2; stroke-dasharray: 6,4; }
    .ext-line { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6,4; }
    .uc-ellipse {
      fill: #f0fdf4;
      stroke: #059669;
      stroke-width: 2;
    }
    .uc-ellipse-accent {
      fill: #ecfdf5;
      stroke: #047857;
      stroke-width: 2.8;
    }
    .uc-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #064e3b;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .uc-text-bold {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      fill: #047857;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .pill-label-dep {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      fill: #b45309;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .pill-label-ext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      fill: #1d4ed8;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-group">
        <h1>
          <span class="badge">Functionality 2</span>
          Multi-Variant Batch Generation (Anti-Cheat Engine)
        </h1>
        <p class="subtitle">Algorithmic creation of up to 6 disjoint sets with question scrambling and cognitive parity verification.</p>
      </div>
      <div class="legend">
        <span style="font-weight:700;">UML Legend:</span>
        <div class="legend-item"><div class="leg-line leg-assoc"></div><span>Association</span></div>
        <div class="legend-item"><div class="leg-line leg-dep"></div><span style="color:#d97706; font-weight:600;">&lt;&lt;depends on&gt;&gt;</span></div>
        <div class="legend-item"><div class="leg-line leg-ext"></div><span style="color:#2563eb; font-weight:600;">&lt;&lt;extend&gt;&gt;</span></div>
      </div>
    </div>
    <div class="svg-container">
      
    <svg viewBox="0 0 980 500" width="980" height="500">
      <defs>
        <marker id="arr-amber-2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
        </marker>
        <marker id="arr-blue-2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
        </marker>
      </defs>

      <!-- System Boundary -->
      <rect x="180" y="15" width="580" height="470" rx="16" fill="#fcfdfd" stroke="#0d9488" stroke-width="2" stroke-dasharray="6,4"/>
      <rect x="300" y="22" width="340" height="26" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
      <text x="470" y="38" text-anchor="middle" font-weight="700" font-size="13" fill="#0f766e">ExamForge — Anti-Cheat Batch Subsystem</text>

      <!-- Primary Actor: Exam Officer -->
      
    <g class="actor-figure" transform="translate(45, 150)">
      <circle cx="45" cy="28" r="18" stroke="#0f172a" stroke-width="3.2" fill="#ffffff" />
      <line x1="45" y1="46" x2="45" y2="100" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="78" y2="64" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="16" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="74" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <text x="45" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Exam Officer</text>
      <text x="45" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">(Instructor)</text>
    </g>
    

      <!-- Secondary Actor: AI Audit Engine -->
      
    <g class="actor-figure" transform="translate(840, 200)">
      <circle cx="45" cy="28" r="18" stroke="#0f172a" stroke-width="3.2" fill="#ffffff" />
      <line x1="45" y1="46" x2="45" y2="100" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="12" y1="64" x2="78" y2="64" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="16" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <line x1="45" y1="100" x2="74" y2="150" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
      <text x="45" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Audit Engine</text>
      <text x="45" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">(AI Verifier)</text>
    </g>
    

      <!-- Use Cases -->
      <!-- UC1: Set Variant Count -->
      <g transform="translate(220, 65)">
        <ellipse cx="105" cy="25" rx="105" ry="24" class="uc-ellipse" style="stroke:#0d9488;"/>
        <text x="105" y="25" class="uc-text" style="fill:#115e59;">Set Variant Count (2 to 6 Sets)</text>
      </g>

      <!-- UC2: Generate Multi-Variant Batch -->
      <g transform="translate(210, 160)">
        <ellipse cx="115" cy="28" rx="115" ry="28" class="uc-ellipse-accent" style="stroke:#0f766e; fill:#f0fdfa;"/>
        <text x="115" y="28" class="uc-text-bold" style="fill:#0f766e;">Generate Multi-Variant Batch</text>
      </g>

      <!-- UC3: Partition Disjoint Question Pool -->
      <g transform="translate(500, 95)">
        <ellipse cx="110" cy="25" rx="110" ry="24" class="uc-ellipse" style="stroke:#0d9488;"/>
        <text x="110" y="25" class="uc-text" style="fill:#115e59;">Partition Disjoint Question Pool</text>
      </g>

      <!-- UC4: Scramble Questions & Options -->
      <g transform="translate(500, 170)">
        <ellipse cx="110" cy="25" rx="110" ry="24" class="uc-ellipse" style="stroke:#0284c7; fill:#f0f9ff;"/>
        <text x="110" y="25" class="uc-text" style="fill:#0369a1;">Scramble Questions &amp; Options</text>
      </g>

      <!-- UC5: Verify Parity Across Sets -->
      <g transform="translate(500, 245)">
        <ellipse cx="110" cy="25" rx="110" ry="24" class="uc-ellipse" style="stroke:#0d9488;"/>
        <text x="110" y="25" class="uc-text" style="fill:#115e59;">Verify Cognitive Parity Across Sets</text>
      </g>

      <!-- UC6: Inspect Variants in Tabs -->
      <g transform="translate(215, 290)">
        <ellipse cx="110" cy="25" rx="110" ry="24" class="uc-ellipse" style="stroke:#0d9488;"/>
        <text x="110" y="25" class="uc-text" style="fill:#115e59;">Inspect Variants in Tabs (Set A-F)</text>
      </g>

      <!-- UC7: AI Similarity Check -->
      <g transform="translate(500, 325)">
        <ellipse cx="110" cy="25" rx="110" ry="24" class="uc-ellipse" style="stroke:#0284c7; fill:#f0f9ff;"/>
        <text x="110" y="25" class="uc-text" style="fill:#0369a1;">AI Similarity &amp; Overlap Audit</text>
      </g>

      <!-- UC8: Export All Variants in Zip -->
      <g transform="translate(215, 395)">
        <ellipse cx="110" cy="25" rx="110" ry="24" class="uc-ellipse" style="stroke:#0d9488;"/>
        <text x="110" y="25" class="uc-text" style="fill:#115e59;">Export All Variants in Zip Archive</text>
      </g>

      <!-- Associations from Exam Officer -->
      <line x1="125" y1="205" x2="220" y2="90" class="assoc-line" />
      <line x1="125" y1="210" x2="210" y2="188" class="assoc-line" />
      <line x1="125" y1="215" x2="215" y2="315" class="assoc-line" />
      <line x1="125" y1="220" x2="220" y2="420" class="assoc-line" />

      <!-- Associations to Audit Engine -->
      <line x1="720" y1="270" x2="835" y2="255" class="assoc-line" />
      <line x1="720" y1="350" x2="835" y2="265" class="assoc-line" />

      <!-- Depends: UC2 depends on UC1 -->
      <line x1="325" y1="115" x2="325" y2="160" class="dep-line" marker-end="url(#arr-amber-2)" />
      <rect x="287" y="128" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="325" y="138" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Depends: UC3 depends on UC2 -->
      <line x1="340" y1="170" x2="495" y2="125" class="dep-line" marker-end="url(#arr-amber-2)" />
      <rect x="390" y="137" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="428" y="147" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Extends: UC4 extends UC3 -->
      <line x1="610" y1="170" x2="610" y2="148" class="ext-line" marker-end="url(#arr-blue-2)" />
      <rect x="582" y="150" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="610" y="160" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Depends: UC5 depends on UC2 -->
      <line x1="340" y1="198" x2="495" y2="255" class="dep-line" marker-end="url(#arr-amber-2)" />
      <rect x="390" y="217" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="428" y="227" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Depends: UC6 depends on UC2 -->
      <line x1="325" y1="218" x2="325" y2="290" class="dep-line" marker-end="url(#arr-amber-2)" />
      <rect x="287" y="245" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="325" y="255" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>

      <!-- Extends: UC7 extends UC6 -->
      <line x1="500" y1="340" x2="435" y2="320" class="ext-line" marker-end="url(#arr-blue-2)" />
      <rect x="442" y="320" width="56" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="470" y="330" class="pill-label-ext">&lt;&lt;extend&gt;&gt;</text>

      <!-- Depends: UC8 depends on UC6 -->
      <line x1="325" y1="340" x2="325" y2="395" class="dep-line" marker-end="url(#arr-amber-2)" />
      <rect x="287" y="358" width="76" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="325" y="368" class="pill-label-dep">&lt;&lt;depends on&gt;&gt;</text>
    </svg>
    
    </div>
  </div>
</body>
</html>
