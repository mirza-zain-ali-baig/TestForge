<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ExamForge — Comprehensive UML Class Diagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1480px;
      height: 980px;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .diagram-wrapper {
      width: 1440px;
      height: 940px;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #f1f5f9;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .title-group h1 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 11px;
      color: #334155;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .svg-canvas {
      width: 100%;
      flex: 1;
    }
    /* Package Boundaries */
    .pkg-rect {
      fill: #fbfcfe;
      stroke: #cbd5e1;
      stroke-width: 1.5;
      stroke-dasharray: 5,4;
      rx: 12px;
    }
    .pkg-title {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      fill: #64748b;
    }
    /* Class Boxes */
    .class-box {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.03));
    }
    .cls-hdr-controller { fill: #2563eb; }
    .cls-hdr-entity { fill: #059669; }
    .cls-hdr-service { fill: #7c3aed; }
    .cls-hdr-repo { fill: #0d9488; }
    .cls-hdr-event { fill: #d97706; }
    
    .cls-body-controller { fill: #f8faff; stroke: #93c5fd; stroke-width: 1.5; }
    .cls-body-entity { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
    .cls-body-service { fill: #faf5ff; stroke: #d8b4fe; stroke-width: 1.5; }
    .cls-body-repo { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.5; }
    .cls-body-event { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; }

    .cls-title-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
    }
    .cls-stereo-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 9.5px;
      font-style: italic;
      fill: rgba(255, 255, 255, 0.9);
      text-anchor: middle;
    }
    .cls-member-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      fill: #1e293b;
    }
    .cls-divider {
      stroke: #e2e8f0;
      stroke-width: 1;
    }
    /* Relationship Lines */
    .rel-line-comp { stroke: #0f172a; stroke-width: 1.8; fill: none; }
    .rel-line-assoc { stroke: #475569; stroke-width: 1.8; fill: none; }
    .rel-line-dep { stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 6,4; fill: none; }
    .rel-multiplicity {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #0f172a;
    }
    .pill-label-dep {
      font-family: system-ui, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      font-style: italic;
      fill: #1d4ed8;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <div class="diagram-wrapper">
    <div class="header">
      <div class="title-group">
        <h1>
          <span class="badge">UML 2.5 Architecture</span>
          ExamForge — Core System Class Diagram
        </h1>
        <p class="subtitle">Complete structural model detailing Controllers, Domain Entities, Repository Layer, AI/DOCX Services, and Event Bus relationships.</p>
      </div>
      <div class="legend">
        <span style="font-weight:700;">UML Legend:</span>
        <div class="legend-item">
          <svg width="24" height="12"><path d="M 0 6 L 14 6 M 14 2 L 22 6 L 14 10 Z" fill="#0f172a" stroke="#0f172a"/></svg>
          <span>Composition</span>
        </div>
        <div class="legend-item">
          <svg width="24" height="12"><path d="M 0 6 L 14 6 M 14 2 L 22 6 L 14 10 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/></svg>
          <span>Aggregation</span>
        </div>
        <div class="legend-item">
          <svg width="24" height="12"><line x1="0" y1="6" x2="18" y2="6" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4,3"/><polygon points="18,3 23,6 18,9" fill="#2563eb"/></svg>
          <span>Dependency (&lt;&lt;use&gt;&gt;)</span>
        </div>
        <div class="legend-item">
          <svg width="24" height="12"><line x1="0" y1="6" x2="24" y2="6" stroke="#475569" stroke-width="2"/></svg>
          <span>Association</span>
        </div>
      </div>
    </div>

    <svg class="svg-canvas" viewBox="0 0 1390 840">
      <defs>
        <!-- Composition Diamond Marker (Filled) -->
        <marker id="marker-comp" viewBox="0 0 16 16" refX="1" refY="8" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 8 L 8 2 L 15 8 L 8 14 Z" fill="#0f172a" stroke="#0f172a" />
        </marker>
        <!-- Aggregation Diamond Marker (Hollow) -->
        <marker id="marker-aggr" viewBox="0 0 16 16" refX="1" refY="8" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
          <path d="M 1 8 L 8 2 L 15 8 L 8 14 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
        </marker>
        <!-- Dependency Arrowhead -->
        <marker id="marker-dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 Z" fill="#2563eb" />
        </marker>
        <marker id="marker-assoc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 Z" fill="#475569" />
        </marker>
      </defs>

      <!-- ========================================== -->
      <!-- PACKAGE BOUNDARIES (Subsystems)            -->
      <!-- ========================================== -->

      <!-- Pkg 1: Controller Layer -->
      <rect x="20" y="24" width="370" height="480" class="pkg-rect"/>
      <text x="35" y="40" class="pkg-title">Package: Controllers &amp; Application Layer</text>

      <!-- Pkg 2: Domain Entities -->
